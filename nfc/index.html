<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noimageindex">
  <meta name="theme-color" content="#140a2e">
  <title>StarriKnight — tap access</title>
  <style>html, body { margin: 0; height: 100%; background: #140a2e; }</style>
  <script>
    /* NFC tags point here (/nfc/).
       This hands straight off to the main page in NFC mode, keeping any ?tag=name
       you programmed onto the tag (it shows up in the drop-down as the tag's name). */
    (function () {
      var extra = location.search ? '&' + location.search.slice(1) : '';
      location.replace('../?nfc' + extra + location.hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=../"></noscript>
</head>
<body></body>
</html>
