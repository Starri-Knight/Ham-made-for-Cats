<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noimageindex">
  <meta name="theme-color" content="#140a2e">
  <title>Lost among the stars — StarriKnight</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <script>
    /* Old links from the previous Google Site. Its public pages moved here: */
    (function () {
      if (/github\.io$/i.test(location.hostname)) return;
      var p = (location.pathname.replace(/\/+$/, '') || '/').toLowerCase();
      var moved = { '/homies': '/', '/home': '/', '/portfolio': '/#art', '/hello': '/#hello', '/contact': '/#hello' };
      if (moved[p]) location.replace(moved[p]);
    })();
  </script>
  <style>
    @font-face { font-family: "Lora"; src: url("/assets/fonts/Lora-Italic-Variable.woff2") format("woff2"); font-weight: 400 700; font-style: italic; font-display: swap; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.4rem;
      color: #f3e7f2; text-align: center;
      font: italic 400 1.1rem/1.6 "Lora", "Iowan Old Style", Palatino, Georgia, serif;
      background:
        radial-gradient(1.4px 1.4px at 14% 22%, rgba(255,241,214,.9), transparent),
        radial-gradient(1.2px 1.2px at 82% 16%, rgba(255,241,214,.7), transparent),
        radial-gradient(1.6px 1.6px at 70% 78%, rgba(255,214,235,.8), transparent),
        radial-gradient(1.2px 1.2px at 24% 84%, rgba(201,180,255,.8), transparent),
        radial-gradient(1px 1px at 48% 12%, rgba(255,241,214,.7), transparent),
        radial-gradient(70% 55% at 50% 36%, rgba(138,79,208,.5), transparent 70%),
        radial-gradient(60% 40% at 50% 100%, rgba(240,107,180,.28), transparent 70%),
        linear-gradient(#170b36, #2a1560 55%, #3d2084);
    }
    main { max-width: 32rem; }
    svg { width: 140px; height: 140px; overflow: visible; }
    svg path { fill: none; stroke: #f9a6d3; stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 4 5; }
    svg circle { fill: #fff1d6; }
    svg .big { filter: drop-shadow(0 0 6px #ffc4e1); }
    h1 { margin: 1.2rem 0 .6rem; font-weight: 600; text-wrap: balance; font-size: clamp(2.2rem, 7vw, 3.4rem); line-height: 1.05; color: #fff1d6; text-shadow: 0 0 26px rgba(240,107,180,.45); }
    p { margin: 0 0 1.8rem; color: #c8b7dc; }
    a {
      display: inline-block; padding: .7rem 1.3rem; border-radius: 999px;
      color: #fff1d6; text-decoration: none; font-weight: 500;
      background: rgba(20,10,46,.55); border: 1px solid rgba(255,196,225,.5);
    }
    a:hover { background: rgba(240,107,180,.22); }
    a:focus-visible { outline: 2px solid #ffc4e1; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <!-- a little question-mark constellation -->
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <path d="M36 38C38 22 52 14 66 16 80 18 88 30 84 44 80 56 64 60 60 72 59 76 59 80 60 84"/>
      <circle cx="36" cy="38" r="3"/><circle cx="66" cy="16" r="2.4"/><circle cx="84" cy="44" r="2.6"/>
      <circle cx="60" cy="72" r="2.2"/><circle cx="60" cy="84" r="2.6"/>
      <circle class="big" cx="60" cy="102" r="4.5"/>
    </svg>
    <h1>Lost among the stars</h1>
    <p>This page isn’t on the star chart. It may have drifted off, or the link has a typo.</p>
    <a href="/">Back to the sky</a>
  </main>
</body>
</html>
